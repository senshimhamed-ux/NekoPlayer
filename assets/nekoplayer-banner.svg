<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">NekoPlayer</title>
  <desc id="desc">Gothic Metal music player for Windows</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08070a"/>
      <stop offset="55%" stop-color="#16080f"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#b51f55" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#5d1234" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="25%" stop-color="#9d1c4d"/>
      <stop offset="50%" stop-color="#f0d7df"/>
      <stop offset="75%" stop-color="#9d1c4d"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#glow)"/>

  <g opacity="0.28" stroke="#8c274b" fill="none">
    <path d="M60 330 C260 270 300 390 500 330 S820 270 1020 330 S1270 390 1340 310"/>
    <path d="M60 350 C260 290 300 410 500 350 S820 290 1020 350 S1270 410 1340 330"/>
  </g>

  <g transform="translate(700 205)" opacity="0.32" filter="url(#soft)">
    <circle r="145" fill="none" stroke="#b51f55" stroke-width="3"/>
    <circle r="115" fill="none" stroke="#e8c4d0" stroke-width="2" stroke-dasharray="7 13"/>
  </g>
  <g transform="translate(700 205)">
    <circle r="115" fill="#0b090d" stroke="#a51d4e" stroke-width="3"/>
    <circle r="92" fill="none" stroke="#57152f" stroke-width="2" stroke-dasharray="5 10"/>
    <path d="M-28-20 L-62-68 L-12-43 L0-83 L12-43 L62-68 L28-20 L55 12 L14 16 L0 58 L-14 16 L-55 12 Z" fill="#bc245b" opacity="0.95"/>
    <circle r="12" fill="#f0d7df"/>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="700" y="108" fill="#f4e7eb" font-size="24" letter-spacing="8" font-weight="600">GOTHIC • METAL • MUSIC</text>
    <text x="700" y="178" fill="#ffffff" font-size="76" letter-spacing="4" font-weight="800" filter="url(#textGlow)">NEKOPLAYER</text>
    <rect x="330" y="220" width="740" height="3" rx="2" fill="url(#line)"/>
    <text x="700" y="268" fill="#d6b4c1" font-size="24" letter-spacing="2">A Windows desktop music player built for your library.</text>
    <text x="700" y="318" fill="#aa7184" font-size="18" letter-spacing="3">LOCAL MP3  •  QUEUE  •  ARTWORK  •  YOUTUBE / YT-DLP  •  FFMPEG</text>
    <text x="700" y="365" fill="#7e5262" font-size="16" letter-spacing="5">VERSION 1.0.0  ·  WINDOWS 10 / 11 · 64-BIT</text>
  </g>
</svg>
